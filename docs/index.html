<title>Masuk</title>
<style>
  :root { --bg: #e9eae6; --panel: #f7f8f4; --fg: #111210; --muted: #5d6058; --line: #cfd1c8; --bad: #b3261e; --lime: #ddf910; --ink: #0e0f0c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121310; --panel: #1c1d19; --fg: #f1f2ec; --muted: #a5a89d; --line: #3a3c34; --bad: #ff8a80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card { width: 100%; max-width: 24rem; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 300; letter-spacing: -.035em; line-height: 1.1; }
  p { margin: 0; color: var(--muted); }
  form { display: grid; gap: 12px; }
  label { font-size: 12px; font-weight: 500; }
  .field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding-left: 16px; background: transparent; }
  .field:focus-within { outline: 2px solid var(--fg); outline-offset: 2px; }
  input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 16px; padding: 10px 0; border: 0; outline: 0; background: transparent; color: var(--fg); }
  .show { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 10px 16px; cursor: pointer; }
  .submit { font: inherit; font-weight: 600; padding: 12px; border-radius: 999px; border: 0; background: var(--lime); color: var(--ink); cursor: pointer; }
  .submit:disabled { opacity: .6; cursor: progress; }
  .show:focus-visible, .submit:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .msg { min-height: 1.45em; font-size: 12px; color: var(--bad); }
</style>

<main class="card">
  <div>
    <h1>Masuk</h1>
    <p>Masukkan password untuk membuka dashboard.</p>

    <label for="password">Password</label>
    <div class="field">

      <button class="show" id="show" type="button" aria-pressed="false">Lihat</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
    <button class="submit" id="submit" type="submit">Masuk</button>
  </form>

</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const payload = JSON.parse($('payload').textContent);
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  async function unlock(password) {
    const subtle = crypto.subtle;
    const salt = bytes(payload.salt), iv = bytes(payload.iv), ct = bytes(payload.ct), mac = bytes(payload.mac);
    const base = await subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: payload.iter }, base, 512));
    const macKey = await subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv);
    signed.set(ct, iv.length);
    if (!(await subtle.verify('HMAC', macKey, mac, signed))) return null;
    const encKey = await subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return new TextDecoder().decode(await subtle.decrypt({ name: 'AES-CBC', iv: iv }, encKey, ct));
  }

  $('show').addEventListener('click', () => {
    const input = $('password'), reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    $('show').textContent = reveal ? 'Sembunyikan' : 'Lihat';
    $('show').setAttribute('aria-pressed', String(reveal));
  });

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('msg'), submit = $('submit');
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'Browser ini tidak bisa membuka halaman. Buka lewat alamat https.'; return; }
    msg.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Memeriksa...';
    let html = null;
    try { html = await unlock($('password').value); } catch (e) { html = null; }
    if (html === null) {
      submit.disabled = false;
      submit.textContent = 'Masuk';
      msg.textContent = 'Password salah. Coba lagi.';
      $('password').select();
      return;
    }
    document.open();
    document.write(html);
    document.close();
  });
})();
</script>
